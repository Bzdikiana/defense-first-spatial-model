[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "defensive-space-value"
version = "0.1.0"
description = "Danger-weighted pitch control, Threat Conceded, defender attribution and decision grading on SkillCorner open data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
viz = ["mplsoccer"]
dev = ["pytest"]

[tool.setuptools]
packages = ["dsv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
